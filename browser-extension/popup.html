<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechVerse AI Agent</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      background-color: #ffffff;
      color: #09090b;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid #e4e4e7;
      padding-bottom: 12px;
    }
    .title {
      font-weight: 700;
      font-size: 16px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #10b981;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #10b981;
    }
    .page-info {
      margin-bottom: 20px;
    }
    .page-label {
      font-size: 12px;
      color: #71717a;
      margin-bottom: 4px;
    }
    .page-url {
      font-size: 14px;
      font-weight: 500;
      word-break: break-all;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      text-align: center;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .btn-primary {
      background-color: #09090b;
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: #27272a;
    }
    .btn-outline {
      background-color: transparent;
      border-color: #e4e4e7;
      color: #09090b;
    }
    .btn-outline:hover {
      background-color: #f4f4f5;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">TechVerse AI</div>
    <div class="status"><div class="dot"></div> Connected</div>
  </div>

  <div class="page-info">
    <div class="page-label">Current Page:</div>
    <div class="page-url" id="currentUrl">Loading...</div>
  </div>

  <button class="btn btn-primary" id="analyzeBtn">Analyze Page</button>
  <button class="btn btn-outline" id="saveBtn">Save as Lead</button>
  <button class="btn btn-outline" id="dashboardBtn">Open Dashboard</button>

  <script src="popup.js"></script>
</body>
</html>
